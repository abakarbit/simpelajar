server {
    listen 80;
    server_name simpelajar.my.id localhost;  # Ganti localhost dengan domain publik
    root /var/www/public;
    index index.php index.html;

    # Set HTTPS proxy headers for all requests
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $server_name;

    # Laravel routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;  # Pastikan service PHP-FPM bisa diakses
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $server_name;
    }

    # Optional: deny access to .env files
    location ~ /\.env {
        deny all;
    }

    # Optional: deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
