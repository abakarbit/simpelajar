version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simpelajar_app
    volumes:
      - ./:/var/www

  webserver:
    image: nginx:alpine
    container_name: simpelajar_nginx
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
